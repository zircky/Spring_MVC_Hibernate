<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head"></head>
<body>

<header th:replace="fragments/header :: header"></header>
<main class="wrapper">

  <aside th:replace="layout :: sidebar"></aside>

  <div class="content bg-light">
    <h1 class="text-dark">User information-page</h1>
    <div class="row row-cols-1 tml-0">
      <div class="col border bg-body" style="height: 3rem">
        <h3 class="">About user</h3>
      </div>
      <div class="col border">
        <div class="table-responsive shadow-sm rounded mt-2">
          <!-- User table -->
          <table class="table table-striped table-bordered text-center">
            <thead class="table-dark">
            <tr>
              <th scope="col">ID</th>
              <th scope="col">First Name</th>
              <th scope="col">Last Name</th>
              <th scope="col">Age</th>
              <th scope="col">Email</th>
              <th scope="col">Role</th>
            </tr>
            </thead>
            <tbody id="tbody"/>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<script th:src="@{js/active.js}"></script>
<script src="/js/app.js"></script>
</body>
</html>
