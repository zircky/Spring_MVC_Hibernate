<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Sing up page</title>
  <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" rel="stylesheet">

</head>
<body>
<main class="p-3 pb-5 rounded-start-lg d-flex justify-content-center">
  <form id="signUpForm">
    <h1 class="h3 mb-3">Please sign up</h1>
    <div class="alert alert-danger d-none" id="errorMessage"></div>
    <div class="mb-3">
      <input
          class="form-control"
          id="firstName" name="name" placeholder="First Name" required
          type="text">
    </div>
    <div class="mb-3">
      <input
          class="form-control"
          id="lastName" name="lastName" placeholder="Last Name" required
          type="text">
    </div>
    <div class="mb-3">
      <input
          autocomplete="off"
          class="form-control"
          id="age" name="age" placeholder="Age" required
          type="number">
    </div>
    <div class="mb-3">
      <input
          class="form-control"
          id="email" name="email" placeholder="Email Address" required
          type="email">
    </div>
    <div class="mb-3">
      <input
          class="form-control"
          id="password" name="password" placeholder="Password"
          type="password">
    </div>
    <div class="mb-3">
      <label class="form-label" for="roles">Select role:</label>
      <select
          class="form-select"
          id="roles"
          required
      >
        <!--        <option value="1">Admin</option>-->
        <!--        <option value="2">User</option>-->
      </select>
    </div>
    <div class="d-flex justify-content-center mt-3">
      <input
          class="btn btn-primary"
          type="submit"
          value="Submit">
    </div>

  </form>
</main>

<script crossorigin="anonymous"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth/signUp.js" type="application/javascript"></script>
</body>
</html>
