<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head"></head>
<body>
<header th:replace="fragments/header :: header"></header>

<main class="wrapper">
  <aside th:replace="layout :: sidebar"></aside>

  <div class="content bg-light">
    <h1>Admin panel</h1>
    <div>
      <div class="nav nav-tabs" id="nav-tab" role="tablist">
        <button aria-controls="nav-user-table" aria-selected="true" class="nav-link active"
                data-bs-target="#nav-user-table"
                data-bs-toggle="tab" id="user-table-tab" role="tab" type="button">User table
        </button>
        <button aria-controls="nav-new-user" aria-selected="false" class="nav-link" data-bs-target="#nav-new-user"
                data-bs-toggle="tab"
                id="new-user-tab" role="tab" type="button">
          <img alt="Add" class="img-fluid " style="width: 1.6rem; height: 1.6rem"
               th:src="@{/img/add-box-line.svg}"><span>New User</span>
        </button>
      </div>
    </div>
    <div class="row row-cols-1" style="position: relative">
      <div aria-labelledby="user-table-tab" class="tab-pane fade show active" id="nav-user-table" role="tabpanel"
           tabindex="0">
        <div class="col border rounded-top ps-3 py-2">
          <h3 class="align-self-center">All users</h3>
        </div>
        <div class="col border">
          <div class="table-responsive shadow-sm rounded mt-2">
            <table class="table table-striped table-bordered text-center">
              <thead class="table-dark">
              <tr>
                <th scope="col">ID</th>
                <th scope="col">First Name</th>
                <th scope="col">Last Name</th>
                <th scope="col">Age</th>
                <th scope="col">Email</th>
                <th scope="col">Role</th>
                <th scope="col">Edit</th>
                <th scope="col">Delete</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="user : ${users}">
                <td th:text="${user.id}"/>
                <td th:text="${user.firstName}"/>
                <td th:text="${user.lastName}"/>
                <td th:text="${user.age}"/>
                <td th:text="${user.email}"/>
                <td th:text="${user.roles}"/>
                <!-- Edit action -->
                <td>
                  <button class="btn btn-outline-primary btn-sm" data-bs-target="#userEdit" data-bs-toggle="modal"
                          th:data-age='${user.age}'
                          th:data-email='${user.email}'
                          th:data-firstName='${user.firstName}'
                          th:data-id='${user.id}'
                          th:data-lastName='${user.lastName}'
                          th:data-roles="${#strings.listJoin(user.roles, ', ')}"
                          type="button">
                    <img alt="Edit" class="img-fluid" style="width: 1.6rem; height: 1.6rem"
                         th:src="@{/img/edit-2-line.svg}">
                    <span>Edit</span>
                  </button>
                </td>
                <td>
                  <button class="btn btn-outline-danger btn-sm" data-bs-target="#userDelete" data-bs-toggle="modal"
                          th:data-age="${user.age}"
                          th:data-email="${user.email}"
                          th:data-firstName="${user.firstName}"
                          th:data-id="${user.id}"
                          th:data-lastName="${user.lastName}"
                          th:data-roles="${user.roles}"
                          type="button">
                    <img alt="Delete" class="img-fluid" style="width: 1.65rem; height: 1.65rem"
                         th:src="@{/img/delete-row.svg}">
                    <span>Delete</span>
                  </button>
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <section th:replace="create :: addNew"></section>
    </div>

  </div>
</main>

<div th:replace="update :: edit"/>
<div th:replace="delete :: delete"/>

<script th:src="@{js/userEdit.js}"></script>
<script th:src="@{js/userDelete.js}"></script>
<script th:src="@{js/active.js}"></script>
</body>
</html>
