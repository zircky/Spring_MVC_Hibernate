<div aria-hidden="true" aria-labelledby="deleteModal" class="modal fade" id="userDelete" tabindex="-1"
     th:fragment="delete"
     xmlns="http://www.w3.org/1999/xhtml"
     xmlns:th="http://www.thymeleaf.org">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title" id="deleteModal">Delete user</h1>
        <button class="btn-close" data-bs-dismiss="modal" type="button"></button>
      </div>
      <div class="modal-body">
        <div>
          <form id="deleteForm" th:method="post">
            <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/>
            <div class="mb-3">
              <label class="" for="deleteUserId"><strong>ID</strong></label>
              <input class="form-control" disabled id="deleteUserId" name="id" placeholder="ID" type="text">
            </div>
            <div class="mb-3">
              <label for="deleteFirstName">First Name</label>
              <input class="form-control" disabled id="deleteFirstName" name="name" placeholder="First Name"
                     type="text">
            </div>
            <div class="mb-3">
              <label for="deleteLastName">Last Name</label>
              <input class="form-control" disabled id="deleteLastName" name="lastName" placeholder="Last Name"
                     type="text">
            </div>
            <div class="mb-3">
              <label for="deleteAge">Age</label>
              <input class="form-control" disabled id="deleteAge" name="age" placeholder="Age" type="number">
            </div>
            <div class="mb-3">
              <label for="deleteEmail">Email</label>
              <input class="form-control" disabled id="deleteEmail" name="email" placeholder="Email Address"
                     type="email">
            </div>
            <div class="mb-3">
              <label class="form-label" for="deleteRoles">Select role:</label>
              <select
                  class="form-select"
                  disabled
                  id="deleteRoles"
              >
                <option th:each="role : ${roles}" th:text="${role.name}" th:value="${role.id}"></option>
              </select>
            </div>
          </form>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
        <button class="btn btn-danger" form="deleteForm" type="submit">Delete</button>
      </div>
    </div>
  </div>
</div>
